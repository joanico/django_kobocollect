{% extends "base.html" %}
{% load static %}

{% block title %}Submission Successful{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-body text-center p-5">
          <div class="mb-4">
            <i class="fas fa-check-circle text-success" style="font-size: 5rem;"></i>
          </div>
          <h2 class="card-title mb-3">Form Submitted Successfully!</h2>
          <p class="card-text lead text-muted mb-4">
            {{ message|default:"Your form has been submitted successfully." }}
          </p>
          <div class="mt-4">
            <a href="{% url 'form-list' %}" class="btn btn-primary btn-lg mr-2">
              <i class="fas fa-list"></i> View All Forms
            </a>
            <a href="{% url 'api-root' %}" class="btn btn-secondary btn-lg">
              <i class="fas fa-home"></i> API Home
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
